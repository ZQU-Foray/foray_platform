# 复制自组织 CI 模板：ZQU-Foray/.github → workflows/ci-template.yml
# 各作业先探测适用文件是否存在，不存在即跳过（空仓也能绿灯）。
# 本仓可按实际技术栈调整；不适用的作业可直接删除。
#
# 设计原则：**空仓库必须绿灯**。
#   每个作业先探测自己适用的文件是否存在，不存在就跳过。
#   这样新仓在初始化当天就能接入 CI，而不会因为「还没有代码」而长期红着
#   —— 长期的红灯会让人习惯性忽略 CI，等于没有 CI。
#
# 更新记录：
#   - 增加 ROS 2 (colcon) 构建与测试作业；仓库内无 ROS 2 package 时自动跳过，
#     因此可安全地保留在通用模板中，不影响纯 Python / 纯 C 仓库。
#   - 为 lint-python / lint-c / test-python 补上同样的探测与跳过逻辑。
#     修正原模板在空仓库上必然失败的两处：
#       1) `pip install -r requirements.txt` —— 文件不存在时直接报错退出；
#       2) `find ... | xargs clang-format` —— 空输入时 xargs 仍会执行一次无参命令。
#   - 修正 find 的 -o 与 -not 优先级问题（补括号），并为 xargs 加 -r / -print0。

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ---- Python 代码检查 ----
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否存在 Python 代码
        id: detect
        shell: bash
        run: |
          if find . -name '*.py' -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 Python 代码，跳过。"
          fi

      - name: Set up Python
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: |
          pip install ruff black

      - name: Lint with ruff
        if: steps.detect.outputs.found == 'true'
        run: ruff check .

      - name: Format check with black
        if: steps.detect.outputs.found == 'true'
        run: black --check --diff .

  # ---- C/C++ 格式检查 ----
  lint-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否存在 C/C++ 代码
        id: detect
        shell: bash
        run: |
          if find . \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
               -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 C/C++ 代码，跳过。"
          fi

      - name: Install clang-format
        if: steps.detect.outputs.found == 'true'
        run: sudo apt-get install -y clang-format

      - name: Format check
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          find . \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
            -not -path './.git/*' -print0 | \
            xargs -0 -r clang-format --dry-run --Werror

  # ---- Python 测试 ----
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否存在 Python 测试
        id: detect
        shell: bash
        run: |
          if find . \( -name 'test_*.py' -o -name '*_test.py' \) \
               -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 Python 测试，跳过。"
          fi

      - name: Set up Python
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Run tests
        if: steps.detect.outputs.found == 'true'
        run: pytest -v

  # ---- 独立 CMake 包构建与测试（不依赖 ROS） ----
  # L1 核心库必须能在没有 ROS 的环境中构建与测试，故单独设一个作业。
  # 包不存在时跳过，保持空仓绿灯。
  build-cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否存在独立 CMake 包
        id: detect
        shell: bash
        run: |
          if [ -f foray_platform/CMakeLists.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现独立 CMake 包，跳过。"
          fi

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-cpp-dev libgtest-dev

      - name: Configure / build / test / install
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$PWD/build/cmake-prefix"

          # 合并包：core + hal 一次构建/测试/安装
          cmake -S foray_platform -B build/platform \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DFORAY_PLATFORM_BUILD_TESTS=ON
          cmake --build build/platform -j"$(nproc)"
          ctest --test-dir build/platform --output-on-failure
          cmake --install build/platform

          # 驱动包：SDK 默认 OFF，逐个探测；不存在则跳过
          for pkg in foray_platform_driver_livox foray_platform_driver_hikvision; do
            if [ ! -f "$pkg/CMakeLists.txt" ]; then
              echo "跳过 $pkg（尚未落地）"
              continue
            fi
            cmake -S "$pkg" -B "build/$pkg" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$PREFIX" \
              -DCMAKE_PREFIX_PATH="$PREFIX" \
              -DFORAY_PLATFORM_BUILD_TESTS=ON \
              -DFORAY_BUILD_DRIVER_HIKVISION=OFF \
              -DFORAY_BUILD_DRIVER_LIVOX=OFF
            cmake --build "build/$pkg" -j"$(nproc)"
            ctest --test-dir "build/$pkg" --output-on-failure
            cmake --install "build/$pkg"
          done

  # ---- 真实 Livox SDK2 编译与链接（不连接硬件） ----
  # 只验证真实后端能编译/链接、导出无绝对路径；HIL 不在 CI 中运行。
  build-cmake-livox-sdk:
    runs-on: ubuntu-22.04
    env:
      # 必须与 foray_ws/.repos 中的 pin 保持一致。
      LIVOX_SDK2_COMMIT: f5d9375f84efe2b15bc0a052d3e18482ed13adf4
    steps:
      - uses: actions/checkout@v4

      - name: 检测 Livox 驱动包
        id: detect
        shell: bash
        run: |
          if [ -f foray_platform_driver_livox/CMakeLists.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现驱动包，跳过。"
          fi

      - name: Checkout pinned Livox SDK2
        if: steps.detect.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          repository: Livox-SDK/Livox-SDK2
          ref: ${{ env.LIVOX_SDK2_COMMIT }}
          path: livox-sdk2-src

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-cpp-dev libgtest-dev

      - name: Build and install Livox SDK2
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S livox-sdk2-src -B "$RUNNER_TEMP/livox-sdk2-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/livox-sdk2-prefix" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_CXX_FLAGS="-include cstdint"
          cmake --build "$RUNNER_TEMP/livox-sdk2-build" -j"$(nproc)"
          cmake --install "$RUNNER_TEMP/livox-sdk2-build"

      - name: Build and install foray_platform
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/foray-prefix"
          cmake -S foray_platform -B build/platform \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DFORAY_PLATFORM_BUILD_TESTS=ON
          cmake --build build/platform -j"$(nproc)"
          ctest --test-dir build/platform --output-on-failure
          cmake --install build/platform

      - name: Build driver against Livox SDK2
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/foray-prefix"
          cmake -S foray_platform_driver_livox -B build/livox-on \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DFORAY_BUILD_DRIVER_LIVOX=ON \
            -DFORAY_LIVOX_SDK_PROVIDER=PREBUILT \
            -DLIVOX_SDK2_ROOT="$RUNNER_TEMP/livox-sdk2-prefix" \
            -DFORAY_PLATFORM_BUILD_TESTS=ON
          cmake --build build/livox-on -j"$(nproc)"
          LD_LIBRARY_PATH="$RUNNER_TEMP/livox-sdk2-prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ctest --test-dir build/livox-on --output-on-failure
          cmake --install build/livox-on

      - name: Verify link and export boundaries
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CORE_TESTS=build/livox-on/foray_platform_driver_livox_tests
          BACKEND_TESTS=build/livox-on/foray_platform_driver_livox_backend_tests

          if ldd "$CORE_TESTS" | grep -q livox_lidar_sdk; then
            echo "core 测试不应链接 Livox SDK" >&2
            exit 1
          fi
          ldd "$BACKEND_TESTS" | grep -q livox_lidar_sdk

          if grep -R "$RUNNER_TEMP/livox-sdk2-prefix" \
               "$RUNNER_TEMP/foray-prefix/lib/cmake"; then
            echo "安装导出包含构建机绝对 SDK 路径" >&2
            exit 1
          fi

  # ---- 目录规范（包布局与命名） ----
  # 规则见 tree.md「命名规则」：
  #   1) 包不得平铺在仓根，必须位于 src/；
  #   2) src/ 下的包名（package.xml 的 <name>）与目录名一致；
  #   3) 工程包必须有 include/ 与 test/（脚本类包 *_tools / *_bringup 豁免）；
  #   4) 包内不得再使用 tools/（C++ 可执行小工具统一放 apps/）。
  dir-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验目录规范
        shell: bash
        run: |
          fail=0

          # 1) 仓根不得平铺 ROS 包
          for pkg in */package.xml; do
            [ -e "$pkg" ] || continue
            echo "::error::$(dirname "$pkg") 是包但不在 src/ 下"
            fail=1
          done

          # 2) src/ 下包名与目录名一致、包内不得有 tools/、工程包须有 include 与 test
          for dir in src/*/; do
            [ -d "$dir" ] || continue
            name="${dir%/}"; name="${name##*/}"
            if [ ! -f "$dir/package.xml" ]; then
              echo "::error::$dir 缺少 package.xml"
              fail=1
              continue
            fi
            declared="$(sed -n 's:.*<name>[[:space:]]*\([^<]*\)[[:space:]]*</name>.*:\1:p' "$dir/package.xml" | head -1)"
            if [ "$declared" != "$name" ]; then
              echo "::error::$dir 的包名「$declared」与目录名「$name」不一致"
              fail=1
            fi
            if [ -d "$dir/tools" ]; then
              echo "::error::$dir 存在 tools/，C++ 可执行小工具应放 apps/"
              fail=1
            fi
            case "$name" in
              *_tools|*_bringup) ;;
              *)
                [ -d "$dir/include" ] || { echo "::error::$dir 缺少 include/"; fail=1; }
                [ -d "$dir/test" ]    || { echo "::error::$dir 缺少 test/"; fail=1; }
                ;;
            esac
          done

          if [ "$fail" -ne 0 ]; then
            echo "目录规范校验失败，规则见 tree.md「命名规则」"
            exit 1
          fi
          echo "目录规范校验通过"

  # ---- ROS 2 构建与测试 ----
  # 适用于 colcon 工作空间仓库（如 foray_navigation）。
  # 仓库内不存在 package.xml 时整个作业自动跳过，故可安全保留在通用模板里。
  build-ros2:
    runs-on: ubuntu-22.04
    container: ros:humble
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否为 ROS 2 仓库
        id: detect
        shell: bash
        run: |
          if find . -name package.xml -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 ROS 2 package，跳过 ROS 2 构建。"
          fi

      - name: 安装依赖 (rosdep)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          apt-get update
          rosdep update
          rosdep install -y -r --from-paths . --ignore-src --rosdistro humble

      - name: 构建 (colcon build)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --cmake-args \
            -DCMAKE_BUILD_TYPE=Release \
            -DFORAY_BUILD_DRIVER_HIKVISION=OFF \
            -DFORAY_BUILD_DRIVER_LIVOX=OFF

      - name: 测试 (colcon test)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
